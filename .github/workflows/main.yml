name: Ejecutar rutina diaria

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Preparar sistema (ffmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        # instalar nltk explícitamente (por si no está en requirements.txt)
        pip install --no-cache-dir nltk
        # descargar los datos NLTK necesarios (punkt)
        python - <<'PY'
import nltk
nltk.download('punkt')
PY

    - name: Comprobar variables de entorno
      run: |
        python - <<'PY'
import os
print("SUMMARIZER_METHOD:", os.getenv("SUMMARIZER_METHOD"))
print("YOUTUBER:", os.getenv("YOUTUBER"))
print("YOUTUBE_API_KEY set?", bool(os.getenv("YOUTUBE_API_KEY")))
print("TRANSCRIPTAPI_KEY set?", bool(os.getenv("TRANSCRIPTAPI_KEY")))
print("TWILIO envs set?", bool(os.getenv("TWILIO_SID")) and bool(os.getenv("TWILIO_TOKEN")))
PY

    - name: Ejecutar script principal
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
        TWILIO_SID: ${{ secrets.TWILIO_SID }}
        TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
        SUMMARIZER_METHOD: extractive
        YOUTUBER: "@JoseLuisCavatv"
      run: |
        python main.py
